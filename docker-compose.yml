services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sims
      MYSQL_USER: sims
      MYSQL_PASSWORD: sims
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"   # host:container — 3307 avoids clashing with a local MySQL
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psims", "-usims"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://sims:sims@db:3306/sims
      SECRET_KEY: dev-secret-change-me
      APPROVAL_THRESHOLD: "500"
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:8080
      EMAIL_BACKEND: console
      EMAIL_FROM: no-reply@sims.io
      MANAGER_FALLBACK_EMAIL: manager@sims.io
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data:
